name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: plugin
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: basecamp/omarchy
          ref: 7be59e1f4b7451d352d4673c560168290792590f
          path: omarchy
          sparse-checkout: |
            bin/omarchy-plugin-validate
            shell/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install Qt 6 QML lint
        run: python -m pip install --disable-pip-version-check --no-cache-dir PySide6-Essentials==6.11.2

      - name: Validate manifest
        run: ./omarchy/bin/omarchy-plugin-validate ./plugin

      - name: Validate release metadata
        run: bash ./plugin/scripts/check-release-metadata.sh

      - name: Lint QML
        env:
          OMARCHY_SHELL_PATH: ${{ github.workspace }}/omarchy/shell
        run: bash ./plugin/scripts/lint-qml.sh

      - name: Run backend tests
        working-directory: plugin
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v

      - name: Run model tests
        run: node --test plugin/tests/model.test.js plugin/tests/profile.test.js plugin/tests/diagnostics.test.js

      - name: Test window placement
        run: bash plugin/tests/test_window_placement.sh

      - name: Check shell syntax
        run: |
          bash -n plugin/scripts/check-release-metadata.sh
          bash -n plugin/scripts/clear-details-window-rule
          bash -n plugin/scripts/place-details-window
          bash -n plugin/scripts/prepare-details-window
          bash -n plugin/scripts/test-panel.sh
          bash -n plugin/scripts/test-service.sh
          bash -n plugin/tests/test_window_placement.sh
